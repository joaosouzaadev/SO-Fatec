<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0210"/>
      <stop offset="55%" stop-color="#210638"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="220" fill="url(#glow)"/>

  <!-- terminal window -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="430" height="180" rx="10" fill="#160325" stroke="#5B21B6" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="34" rx="10" fill="#2A0845"/>
    <circle cx="20" cy="17" r="6" fill="#E9545480"/>
    <circle cx="42" cy="17" r="6" fill="#E9A65480"/>
    <circle cx="64" cy="17" r="6" fill="#8FD9A880"/>
    <text x="215" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#B79DB5" text-anchor="middle">ubuntu@vm: ~</text>

    <text x="20" y="70" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#F0ABFC">$ man ubuntu</text>
    <text x="20" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#8FD9A8">6 funcionalidades encontradas</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#8FD9A8">que o Windows não possui</text>
    <text x="20" y="154" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#B79DB5">$ _</text>
  </g>

  <!-- title -->
  <g transform="translate(560,95)">
    <text x="0" y="0" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="34" font-weight="700" fill="#F5EDF4">Manual: Ubuntu vs Windows</text>
    <text x="0" y="42" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#D8B4FE">6 funcionalidades do Ubuntu que o Windows não tem</text>
    <rect x="0" y="62" width="230" height="30" rx="15" fill="#3B0764" stroke="#A855F7" stroke-width="1"/>
    <text x="115" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#E9D5FF" text-anchor="middle">Tarefa 05 · Virtualização</text>
  </g>
</svg>
